<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 彻底禁用 HTML 页面缓存 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Bilibili 编程语言教程热度档案馆</title>
    <!-- 引入 Chart.js 图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151d30;
            --card-sub: #1e2942;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #2d3a54;
            --accent: #38bdf8;
            --bar-color: rgba(56, 189, 248, 0.16);
            --bar-line: rgba(56, 189, 248, 0.5);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px 16px;
        }
        .container { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 22px; margin: 0; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .update-time { font-size: 13px; color: var(--text-dim); }
        .github-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--card-sub); color: var(--text);
            border: 1px solid var(--border); padding: 5px 12px;
            border-radius: 6px; font-size: 13px; text-decoration: none;
            transition: all 0.2s;
        }
        .github-btn:hover { border-color: var(--accent); color: var(--accent); }
        .github-btn svg { width: 15px; height: 15px; fill: currentColor; }

        .section-box {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 18px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .controls-bar {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px;
        }
        .controls-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        
        .filter-btn, .mode-btn {
            background: var(--card-sub); color: var(--text-dim); border: 1px solid var(--border);
            padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .filter-btn:hover, .mode-btn:hover { color: var(--text); border-color: var(--text-dim); }
        .filter-btn.active, .mode-btn.active { background: var(--accent); color: #0b0f19; font-weight: 600; border-color: var(--accent); }
        
        select.metric-select {
            background: var(--card-sub); color: var(--text); border: 1px solid var(--border);
            padding: 5px 10px; border-radius: 6px; font-size: 12px; outline: none;
        }

        .chart-wrapper { position: relative; width: 100%; height: 560px; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; min-width: 860px; table-layout: fixed; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { background: var(--card-sub); color: var(--text-dim); font-weight: 600; cursor: pointer; user-select: none; }
        th:hover, th.sort-active { color: var(--accent); }
        th.sort-desc::after { content: " ▼"; font-size: 10px; }
        th.sort-asc::after { content: " ▲"; font-size: 10px; }
        tr.data-row { transition: background 0.35s ease-out; }
        tr.data-row:hover td { background: rgba(255, 255, 255, 0.04); }

        .col-rank { width: 50px; text-align: center; color: var(--text-dim); font-weight: bold; }
        .col-tag { width: 105px; color: var(--accent); font-weight: 600; }
        .col-num { width: 95px; font-family: monospace; font-size: 13px; }
        .col-num.active-metric { color: #fff; font-weight: 700; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
        .col-title { width: auto; overflow: hidden; text-overflow: ellipsis; }
        .title-link { color: var(--text); text-decoration: none; }
        .title-link:hover { color: var(--accent); text-decoration: underline; }
        .loading { text-align: center; padding: 40px; color: var(--text-dim); }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部导航 -->
        <div class="header">
            <h1>⚡ Bilibili 编程语言飞速发展榜</h1>
            <div class="header-actions">
                <div class="update-time" id="updateTime">最后更新: 加载中...</div>
                <a class="github-btn" href="https://github.com/cnlnr/Bilibili-Programming-Language-Rankings" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                    GitHub
                </a>
            </div>
        </div>

        <!-- 历史趋势折线图区域 -->
        <div class="section-box">
            <div class="controls-bar">
                <!-- 严格按最初要求的跨度按钮 -->
                <div class="btn-group" id="timeFilters">
                    <span style="font-size: 13px; color: var(--text-dim); margin-right: 4px;">跨度:</span>
                    <button class="filter-btn active" data-days="0">全部</button>
                    <button class="filter-btn" data-days="7">7天</button>
                    <button class="filter-btn" data-days="30">1个月</button>
                    <button class="filter-btn" data-days="365">1年</button>
                    <button class="filter-btn" data-days="1095">3年</button>
                    <button class="filter-btn" data-days="1825">5年</button>
                    <button class="filter-btn" data-days="3650">10年</button>
                    <button class="filter-btn" data-days="7300">20年</button>
                    <button class="filter-btn" data-days="10950">30年</button>
                    <button class="filter-btn" data-days="18250">50年</button>
                    <button class="filter-btn" data-days="36500">100年</button>
                </div>
                
                <!-- 模式切换与指标下拉 -->
                <div class="controls-right">
                    <div class="btn-group" id="viewModeGroup">
                        <button class="mode-btn active" data-mode="delta">⚡ 飞速发展榜 (净增)</button>
                        <button class="mode-btn" data-mode="total">🔥 热度总量趋势</button>
                    </div>
                    <select class="metric-select" id="chartMetricSelect">
                        <option value="view">播放量</option>
                        <option value="favorite" selected>收藏数</option>
                        <option value="like">点赞数</option>
                        <option value="coin">硬币数</option>
                        <option value="reply">评论数</option>
                    </select>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- 实时详细数据排行榜 -->
        <div class="section-box">
            <div class="table-wrap">
                <table id="rankTable">
                    <thead>
                        <tr>
                            <th class="col-rank">排名</th>
                            <th class="col-tag">标签</th>
                            <th class="col-num sort-active sort-desc" data-key="favorite">收藏数</th>
                            <th class="col-num" data-key="view">播放量</th>
                            <th class="col-num" data-key="like">点赞数</th>
                            <th class="col-num" data-key="coin">硬币数</th>
                            <th class="col-num" data-key="reply">评论数</th>
                            <th class="col-num" data-key="danmaku">弹幕数</th>
                            <th class="col-title">视频标题</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="9" class="loading">正在加载数据...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let historySnapshots = [];
        let currentTableData = [];
        let currentSortKey = "favorite";
        let isAsc = false;
        let chartInstance = null;
        let selectedSpanDays = 0;
        let viewMode = "delta";

        const METRIC_INDEX_MAP = {
            favorite: 3, view: 4, like: 5, coin: 6, reply: 7, danmaku: 8
        };

        const COLOR_PALETTE = [
            '#38bdf8', '#f43f5e', '#10b981', '#f59e0b', '#8b5cf6',
            '#ec4899', '#06b6d4', '#84cc16', '#a855f7', '#64748b',
            '#fb923c', '#4ade80', '#22d3ee', '#818cf8', '#e879f9',
            '#facc15', '#2dd4bf', '#f87171', '#34d399', '#60a5fa'
        ];

        function fmt(n) {
            if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(1) + '亿';
            if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(1) + '万';
            return (n || 0).toLocaleString();
        }

        function renderTable() {
            if (!currentTableData.length) return;
            currentTableData.sort((a, b) => isAsc ? (a[currentSortKey] - b[currentSortKey]) : (b[currentSortKey] - a[currentSortKey]));

            const maxVal = Math.max(...currentTableData.map(r => r[currentSortKey]), 1);

            document.getElementById("tableBody").innerHTML = currentTableData.map((r, idx) => {
                const pct = ((r[currentSortKey] / maxVal) * 100).toFixed(1);
                const rowBg = `linear-gradient(to right, var(--bar-color) 0%, var(--bar-color) ${pct}%, var(--bar-line) ${pct}%, transparent calc(${pct}% + 1.5px), transparent 100%)`;

                return `
                    <tr class="data-row" style="background: ${rowBg};">
                        <td class="col-rank">${idx + 1}</td>
                        <td class="col-tag">${r.tag}</td>
                        <td class="col-num ${currentSortKey === 'favorite' ? 'active-metric' : ''}" title="精准数值: ${r.favorite.toLocaleString()}">${fmt(r.favorite)}</td>
                        <td class="col-num ${currentSortKey === 'view' ? 'active-metric' : ''}" title="精准数值: ${r.view.toLocaleString()}">${fmt(r.view)}</td>
                        <td class="col-num ${currentSortKey === 'like' ? 'active-metric' : ''}" title="精准数值: ${r.like.toLocaleString()}">${fmt(r.like)}</td>
                        <td class="col-num ${currentSortKey === 'coin' ? 'active-metric' : ''}" title="精准数值: ${r.coin.toLocaleString()}">${fmt(r.coin)}</td>
                        <td class="col-num ${currentSortKey === 'reply' ? 'active-metric' : ''}" title="精准数值: ${r.reply.toLocaleString()}">${fmt(r.reply)}</td>
                        <td class="col-num ${currentSortKey === 'danmaku' ? 'active-metric' : ''}" title="精准数值: ${r.danmaku.toLocaleString()}">${fmt(r.danmaku)}</td>
                        <td class="col-title">
                            <a class="title-link" href="https://www.bilibili.com/video/${r.bvid}" target="_blank" title="${r.title}">${r.title}</a>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        function updateTrendChart() {
            if (!historySnapshots.length) return;

            const selectedMetric = document.getElementById("chartMetricSelect").value;
            const metricIdx = METRIC_INDEX_MAP[selectedMetric];

            const lastSnapTime = new Date(historySnapshots[historySnapshots.length - 1].updated_at.replace(/-/g, "/")).getTime();
            
            const filteredSnapshots = historySnapshots.filter(snap => {
                if (selectedSpanDays === 0) return true;
                const snapTime = new Date(snap.updated_at.replace(/-/g, "/")).getTime();
                return (lastSnapTime - snapTime) <= (selectedSpanDays * 24 * 3600 * 1000);
            });

            const labels = filteredSnapshots.map(s => {
                const parts = s.updated_at.split(" ");
                return filteredSnapshots.length <= 15 ? `${parts[0].slice(5)} ${parts[1]}` : parts[0];
            });

            let targetTags = [];

            if (viewMode === "delta") {
                const growthMap = currentTableData.map(d => {
                    const tag = d.tag;
                    let startVal = null, endVal = null;
                    for (const snap of filteredSnapshots) {
                        const row = (snap.rows || []).find(r => r[0] === tag);
                        if (row) {
                            if (startVal === null) startVal = row[metricIdx];
                            endVal = row[metricIdx];
                        }
                    }
                    const delta = (endVal !== null && startVal !== null) ? (endVal - startVal) : 0;
                    return { tag, delta };
                });

                growthMap.sort((a, b) => b.delta - a.delta);
                targetTags = growthMap.slice(0, 20).map(item => item.tag);
            } else {
                const sortedByTotal = [...currentTableData].sort((a, b) => b[selectedMetric] - a[selectedMetric]);
                targetTags = sortedByTotal.slice(0, 20).map(d => d.tag);
            }

            const datasets = targetTags.map((tag, i) => {
                const color = COLOR_PALETTE[i % COLOR_PALETTE.length];
                
                let baseVal = null;
                const dataPoints = filteredSnapshots.map(snap => {
                    const row = (snap.rows || []).find(r => r[0] === tag);
                    if (!row) return null;
                    const val = row[metricIdx];
                    if (viewMode === "delta") {
                        if (baseVal === null) baseVal = val;
                        return val - baseVal;
                    }
                    return val;
                });

                return {
                    label: tag,
                    data: dataPoints,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    tension: 0,
                    pointRadius: 4,
                    pointHoverRadius: 6
                };
            });

            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = document.getElementById('trendChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { 
                            position: 'top',
                            labels: { 
                                color: '#94a3b8', 
                                font: { size: 11 }, 
                                boxWidth: 10,
                                padding: 8
                            } 
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const val = ctx.raw || 0;
                                    const dIndex = ctx.dataIndex;
                                    if (viewMode === "delta") {
                                        const prefix = val >= 0 ? `+${val.toLocaleString()}` : `${val.toLocaleString()}`;
                                        return ` ${ctx.dataset.label} 净增: ${prefix}`;
                                    } else {
                                        let diffText = "";
                                        if (dIndex > 0) {
                                            const prevVal = ctx.dataset.data[dIndex - 1] || 0;
                                            const diff = val - prevVal;
                                            diffText = diff >= 0 ? ` (▲ +${diff.toLocaleString()})` : ` (▼ ${diff.toLocaleString()})`;
                                        }
                                        return ` ${ctx.dataset.label}: ${fmt(val)}${diffText}`;
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            grid: { color: 'rgba(45, 58, 84, 0.4)' }, 
                            ticks: { color: '#94a3b8', font: { size: 11 } } 
                        },
                        y: { 
                            beginAtZero: viewMode === "delta",
                            grace: '8%',
                            grid: { color: 'rgba(45, 58, 84, 0.4)' }, 
                            ticks: { 
                                color: '#94a3b8', 
                                callback: (v) => (viewMode === "delta" && v > 0 ? `+${fmt(v)}` : fmt(v))
                            } 
                        }
                    }
                }
            });
        }

        document.querySelectorAll("th[data-key]").forEach(th => {
            th.addEventListener("click", () => {
                const key = th.getAttribute("data-key");
                if (currentSortKey === key) isAsc = !isAsc;
                else { currentSortKey = key; isAsc = false; }
                document.querySelectorAll("th").forEach(h => h.classList.remove("sort-active", "sort-desc", "sort-asc"));
                th.classList.add("sort-active", isAsc ? "sort-asc" : "sort-desc");
                renderTable();
            });
        });

        document.getElementById("timeFilters").addEventListener("click", (e) => {
            if (e.target.tagName === "BUTTON") {
                document.querySelectorAll("#timeFilters button").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                selectedSpanDays = parseInt(e.target.getAttribute("data-days"), 10);
                updateTrendChart();
            }
        });

        document.getElementById("viewModeGroup").addEventListener("click", (e) => {
            if (e.target.tagName === "BUTTON") {
                document.querySelectorAll("#viewModeGroup button").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                viewMode = e.target.getAttribute("data-mode");
                updateTrendChart();
            }
        });

        document.getElementById("chartMetricSelect").addEventListener("change", updateTrendChart);

        fetch(`./data.json?_t=${Date.now()}`, { cache: 'no-store' })
            .then(res => res.json())
            .then(data => {
                historySnapshots = Array.isArray(data) ? data : [data];
                const latestSnapshot = historySnapshots[historySnapshots.length - 1];

                document.getElementById('updateTime').innerText = `最后更新: ${latestSnapshot.updated_at || '未知'}`;

                currentTableData = (latestSnapshot.rows || []).map(([tag, bvid, title, favorite, view, like, coin, reply, danmaku]) => ({
                    tag, bvid, title, favorite, view, like, coin, reply, danmaku
                }));

                renderTable();
                updateTrendChart();
            })
            .catch(err => {
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="9" class="loading" style="color:#ef4444">加载 data.json 失败: ${err}</td></tr>`;
            });
    </script>
</body>
</html>
