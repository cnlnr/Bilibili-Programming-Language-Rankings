name: Monthly Update Bilibili Ranking Data

on:
  schedule:
    # 每月 1 号 UTC 00:00 (北京时间 08:00) 定时自动运行
    - cron: '0 0 1 * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮立即测试触发

# 赋予 GitHub Actions 写权限以推送 data.json
permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行数据抓取
        run: |
          python update_data.py

      - name: 提交并推送 data.json 回 main 分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data.json
          
          # 检查是否有数据变更，有变更才提交，避免无变动时报错中断
          if git diff --staged --quiet; then
            echo "数据未发生变化，无需提交。"
          else
            git commit -m "chore(data): auto update ranking data.json [skip ci]"
            git push origin main
          fi
